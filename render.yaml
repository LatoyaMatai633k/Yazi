services:
  - type: web
    name: yazi-dev-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_ID
        value: gemini-1.5-flash
      - key: DATABASE_URL
        fromDatabase:
          name: yazi-dev-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: yazi-dev-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: yazi-dev-db
    databaseName: yazidev
    plan: free
